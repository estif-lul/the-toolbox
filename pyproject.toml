[project]
name = "toolbox-film"
version = "0.1.0"
description = "The Toolbox: a Heritage Short built by a storyboard-driven AI media pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "kaggle>=2.2.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "six>=1.17.0",
]

[project.scripts]
toolbox-film = "pipeline.run:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
