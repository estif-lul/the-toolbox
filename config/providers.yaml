# Provider profiles. Each stage lists a chain: the first entry is the primary, the rest are
# fallbacks tried in order when the primary is exhausted (retries used up, daily quota gone,
# or the model no longer exists). Switch with `--profile paid` or PROFILE=paid.
# storyboard.json never changes between profiles; provider + model are part of every cache key,
# so switching regenerates only the stages whose provider changed.
#
# Model ids verified in Step 0 (2026-11-25) against the live APIs: see FAILURES.md F03/F04 and
# outputs/smoke/models_*.json for what was listed.

default_profile: free

profiles:
  free:
    # Free-tier limits from AI Studio (2026-11-25, COSTS.md): pacing = 60 s / RPM, rounded up.
    # Failed requests (503) count against RPD too, so the overloaded model gets fewer attempts.
    text:                                   # short text calls (translation, checks)
      - provider: gemini_text
        model: gemini-3.8-flash             # 5 RPM, 250K TPM, 20 RPD
        params: {temperature: 0.7, min_interval_s: 13, max_attempts: 2, timeout_s: 60}
      - provider: gemini_text
        model: gemini-3.5-flash-lite        # 15 RPM, 250K TPM, 500 RPD; no 3.8 Flash-Lite text model (F04)
        params: {temperature: 0.7, min_interval_s: 4}

    script:                                 # the storyboard draft: one long JSON answer, so a
      - provider: gemini_text               # longer timeout than the short text calls
        model: gemini-3.8-flash             # 1 attempt: 503 all day on 25 Nov (F05), and 503s use RPD
        params: {temperature: 0.8, min_interval_s: 13, max_attempts: 1, timeout_s: 180}
      - provider: gemini_text
        model: gemini-3.5-flash             # older Flash, listed for this key (outputs/smoke/models_gemini.json)
        params: {temperature: 0.8, min_interval_s: 13, max_attempts: 2, timeout_s: 180}
      - provider: gemini_text
        model: gemini-3.5-flash-lite
        params: {temperature: 0.8, min_interval_s: 4, timeout_s: 180}

    transcribe:                             # narration --verify: hears each line back (audio in, text out)
      - provider: gemini_text               # not 3.8 Flash: 503 all day on 25 Nov, and 20 RPD
        model: gemini-3.5-flash-lite        # 15 RPM, 500 RPD
        params: {temperature: 0, min_interval_s: 4, timeout_s: 60}
      - provider: gemini_text
        model: gemini-3.5-flash
        params: {temperature: 0, min_interval_s: 13, timeout_s: 60}

    tts:                                    # narration; stock voices only, no silent fallback
      # batch_lines: lines per request (one turn each, split at <long pause>); rpd: the daily
      # request limit, used only to warn before a run (pipeline/narration.py quota_note).
      - provider: gemini_tts
        model: gemini-3.8-flash-tts         # Interactions API (F03); 3 RPM, 10K TPM, **10 RPD**
        params: {min_interval_s: 21, max_attempts: 2, batch_lines: 8, rpd: 10}
      - provider: gemini_tts
        model: gemini-3.8-flash-lite-tts    # 3 RPM, 10K TPM, **10 RPD**
        params: {min_interval_s: 21, max_attempts: 2, batch_lines: 8, rpd: 10}

    image:                                  # keyframes and reference sheets
      - provider: cloudflare_image
        model: "@cf/black-forest-labs/flux-2-klein-4b"   # Apache 2.0 (the 9B is non-commercial)
        params: {steps: 4}
      - provider: cloudflare_image
        model: "@cf/black-forest-labs/flux-1-schnell"
        params: {steps: 4}

    video:                                  # moving shots
      - provider: kaggle_wan
        model: Wan-AI/Wan2.2-TI2V-5B-Diffusers
        params: {width: 704, height: 704, frames: 81, steps: 30, guidance: 5.0, time_budget_s: 5000}
      - provider: kenburns                  # local FFmpeg, always available
        model: ffmpeg-zoompan
        params: {fps: 24, size: 1024}

    music:                                  # score (the stage also falls back to the previous
      - provider: kaggle_acestep            # cached candidate, then a code-generated pad: Step 2/4)
        model: ACE-Step/ACE-Step-1.5
        params: {candidates: 3}

    kenburns:
      - provider: kenburns
        model: ffmpeg-zoompan
        params: {fps: 24, size: 1024}

  # The paid / frontier lane (docs/PAID_LANE.md). Stubs until implemented; each
  # stage keeps the free adapter as its fallback so a missing implementation never silently
  # changes quality. Model ids are placeholders until prices and terms are checked.
  paid:
    text:
      - provider: paid_text
        model: claude-sonnet-5-5
      - provider: gemini_text
        model: gemini-3.8-flash
    script:
      - provider: paid_text
        model: claude-sonnet-5-5
      - provider: gemini_text
        model: gemini-3.8-flash
        params: {temperature: 0.8, timeout_s: 180}
    transcribe:
      - provider: gemini_text
        model: gemini-3.5-flash-lite
        params: {temperature: 0}
    tts:
      - provider: paid_tts
        model: gemini-3.8-flash-tts-paid-tier
      - provider: gemini_tts
        model: gemini-3.8-flash-tts
    image:
      - provider: paid_image
        model: gemini-nano-banana-2.1
      - provider: cloudflare_image
        model: "@cf/black-forest-labs/flux-2-klein-4b"
    video:
      - provider: rented_gpu_video
        model: Wan-AI/Wan2.2-TI2V-5B-Diffusers@L40S
      - provider: paid_video
        model: gemini-omni-flash
      - provider: kenburns
        model: ffmpeg-zoompan
    music:
      - provider: paid_music
        model: lyria-3.5
      - provider: kaggle_acestep
        model: ACE-Step/ACE-Step-1.5
    kenburns:
      - provider: kenburns
        model: ffmpeg-zoompan
